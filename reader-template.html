<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title><link rel="stylesheet" href="fonts/fonts.css"><style>
:root{--bg:#faf7f0;--ink:#26221c;--mut:#7b7264;--line:#e3dccd;--acc:#8a3b1e}
@media (prefers-color-scheme:dark){:root{--bg:#1c1a17;--ink:#e9e3d7;--mut:#a0978a;--line:#39342c;--acc:#e0916c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.7 "Literata Variable","Noto Serif Variable",Georgia,serif}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;z-index:2}
header b{margin-right:auto}button{font:14px system-ui,sans-serif;padding:6px 10px;border:1px solid var(--line);background:none;color:inherit;border-radius:6px;cursor:pointer}button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.wrap{display:grid;grid-template-columns:260px minmax(0,1fr);max-width:1400px;margin:auto}nav{padding:16px;font:14px/1.4 system-ui,sans-serif;position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto;border-right:1px solid var(--line)}nav h3{font-size:12px;color:var(--mut);margin:16px 0 4px}nav a{display:block;color:inherit;text-decoration:none;padding:3px 0}nav a:hover{color:var(--acc)}
main{padding:24px 28px;min-width:0}.row{display:grid;grid-template-columns:1fr 1fr;gap:32px}.row p{margin:0 0 1em;overflow-wrap:anywhere}.src{color:var(--mut)}.empty{font-style:italic;color:var(--mut)}
h2{line-height:1.3;margin:2em 0 1em}h2.part{color:var(--acc)}body.vi-only .src,body.src-only .vi{display:none}h2 small{display:block;font-size:.65em;font-weight:400;color:var(--mut)}h2 .only{display:none}body.src-only h2 .only{display:inline;color:inherit}body.src-only h2 small{display:none}body.vi-only .row,body.src-only .row{grid-template-columns:minmax(0,42em)}footer{color:var(--mut);font-size:14px;margin-top:48px}
@media (max-width:760px){.wrap{display:block}nav{display:none}main{padding:16px}.row{grid-template-columns:1fr;gap:0}}
</style></head><body class="vi-only"><header><b>{{TITLE}} · {{AUTHOR}}</b><button data-m="vi-only" class="on">Tiếng Việt</button><button data-m="both">Song ngữ</button><button data-m="src-only">{{SOURCE_LABEL}}</button></header>
<div class="wrap"><nav>{{NAV}}</nav><main>{{BODY}}<footer>{{PROVENANCE}}</footer></main></div>
<script>document.querySelectorAll('button[data-m]').forEach(function(b){b.onclick=function(){document.body.className=b.dataset.m==='both'?'':b.dataset.m;document.querySelectorAll('button[data-m]').forEach(function(x){x.classList.toggle('on',x===b)})}})</script></body></html>
